<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Goals-Manager · Sign in</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" href="/icon-192.png">
  <meta name="theme-color" content="#7c5cff">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    .login-card {
      width: min(360px, 100%); text-align: center; padding: 32px 24px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
    }
    .login-card img { width: 64px; height: 64px; border-radius: 16px; }
    .login-card h1 { margin: 14px 0 4px; font-size: 22px; }
    .login-card p { margin: 0 0 22px; color: var(--muted); }
    .google-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
      padding: 11px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface);
      color: var(--text); font-weight: 600; text-decoration: none;
    }
    .google-btn:hover { background: var(--surface-2); }
    .login-error { margin-top: 16px; color: var(--danger); font-size: 14px; }
  </style>
</head>
<body>
  <main class="login">
    <div class="login-card">
      <img src="/icon-192.png" alt="">
      <h1>Goals-Manager</h1>
      <p>Sign in to see your goals</p>
      <a class="google-btn" href="/auth/google">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Sign in with Google
      </a>
      <div class="login-error" id="err" hidden></div>
    </div>
  </main>
  <script>
    const msgs = {
      not_allowed: 'That Google account isn’t allowed to use this app.',
      state: 'Sign-in expired. Please try again.',
      google: 'Google sign-in failed. Please try again.',
    };
    const e = new URLSearchParams(location.search).get('error');
    if (e) { const el = document.getElementById('err'); el.textContent = msgs[e] || 'Sign-in failed.'; el.hidden = false; }
  </script>
</body>
</html>
