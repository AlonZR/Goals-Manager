<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Goals-Manager</title>
  <link rel="icon" href="/icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#7c5cff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Goals-Manager">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Goals-Manager</h1>
      <span class="today" id="today"></span>
    </div>
    <div class="top-actions">
      <button class="btn ghost" id="toggleDesc" title="Show / hide descriptions under all goals">Show details</button>
      <button class="btn ghost" id="toggleDone" title="Show / hide completed goals">Hide done</button>
      <button class="btn primary" id="addSubject">+ Subject</button>
      <button class="btn ghost icon-only" id="moreBtn" aria-label="More" title="Backup &amp; account">⋯</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </header>

  <!-- Mobile only: choose which time column to show -->
  <nav class="interval-tabs" id="intervalTabs" aria-label="Time interval"></nav>

  <main id="board" class="board" aria-live="polite"></main>

  <div id="toast" class="toast" role="status" hidden></div>

  <template id="subjectDialogTpl">
    <dialog class="dialog">
      <form method="dialog">
        <h2 class="dialog-title"></h2>
        <label>Name <input name="name" dir="auto" required maxlength="40" autocomplete="off"></label>
        <label>Color <input name="color" type="color" value="#7c5cff"></label>
        <div class="dialog-actions">
          <button value="cancel" class="btn ghost" formnovalidate>Cancel</button>
          <button value="ok" class="btn primary">Save</button>
        </div>
      </form>
    </dialog>
  </template>

  <template id="goalDialogTpl">
    <dialog class="dialog">
      <form method="dialog">
        <h2 class="dialog-title">Edit goal</h2>
        <label>Goal <input name="title" dir="auto" required maxlength="200" autocomplete="off"></label>
        <label>Description <textarea name="description" dir="auto" rows="4" maxlength="2000" placeholder="More details (optional)"></textarea></label>
        <div class="dialog-row">
          <label>Time <select name="interval">
            <option value="daily">Daily</option><option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option><option value="yearly">Yearly</option>
          </select></label>
          <label>Subject <select name="subjectId"></select></label>
        </div>
        <label class="switch-row">
          <input type="checkbox" name="recurring">
          <span><b>↻ Repeats</b> <small class="repeat-hint"></small></span>
        </label>
        <div class="dialog-actions">
          <button value="cancel" class="btn ghost" formnovalidate>Cancel</button>
          <button value="ok" class="btn primary">Save</button>
        </div>
      </form>
    </dialog>
  </template>

  <script src="/app.js"></script>
</body>
</html>
